<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" role="img" aria-label="UKU studio">
  <title>UKU studio</title>
  <!-- Marca: cáliz / vientre con semilla interior -->
  <g transform="translate(20, 20)" stroke="#322a4a" fill="none">
    <circle cx="40" cy="40" r="36" stroke-width="0.8" opacity="0.4"/>
    <path d="M 18 22 C 18 44 26 58 40 58 C 54 58 62 44 62 22" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="40" cy="42" rx="3.4" ry="4.4" fill="#322a4a" stroke="none" opacity="0.85"/>
  </g>

  <!-- Wordmark: UKU studio en Khand light -->
  <g transform="translate(120, 0)" fill="#322a4a">
    <text x="0" y="60" font-family="Khand, 'Helvetica Neue', sans-serif" font-weight="300" font-size="56" letter-spacing="6">UKU</text>
    <text x="2" y="86" font-family="Montserrat, sans-serif" font-weight="300" font-size="11" letter-spacing="6">STUDIO</text>
  </g>
</svg>
