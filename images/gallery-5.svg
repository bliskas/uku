<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g5bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E1D4EC"/>
      <stop offset="100%" stop-color="#F0E8F5"/>
    </linearGradient>
    <linearGradient id="g5t" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0E8F5"/>
