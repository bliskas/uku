    <!-- Watercolor pastel swirl overlay -->
    <ellipse cx="-30" cy="-20" rx="45" ry="30" fill="#CBB8DC" opacity="0.45"/>
    <ellipse cx="30" cy="50" rx="40" ry="28" fill="#F4D4BE" opacity="0.35"/>
    <ellipse cx="10" cy="-80" rx="30" ry="20" fill="#B7C7AD" opacity="0.25"/>
    <ellipse cx="40" cy="100" rx="35" ry="20" fill="#A791C4" opacity="0.3"/>

